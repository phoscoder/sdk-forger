[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
serde_yaml = "0.9"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-php = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
clap = { version = "4", features = ["derive"] }
sdkforge-ir = { path = "crates/ir" }
sdkforge-ingest = { path = "crates/ingest" }
sdkforge-planner = { path = "crates/planner" }
sdkforge-generate = { path = "crates/generate" }
sdkforge-verify = { path = "crates/verify" }
sdkforge-mock = { path = "crates/mock" }
sdkforge-repo = { path = "crates/repo" }
